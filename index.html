<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#15100b">
  <title>Coyote &amp; Crow GM</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="tab-bar">
    <button class="tab-btn active" data-tab="names"><span class="tab-label">Names</span></button>
    <button class="tab-btn" data-tab="npcs"><span class="tab-label">NPCs</span></button>
    <button class="tab-btn" data-tab="pc"><span class="tab-label">PCs</span></button>
    <button class="tab-btn" data-tab="encounter"><span class="tab-label">Encounter</span></button>
    <button class="tab-btn" data-tab="dice"><span class="tab-label">Dice</span></button>
    <button class="tab-btn" data-tab="initiative"><span class="tab-label">Initiative</span></button>
    <button class="tab-btn" data-tab="rules"><span class="tab-label">Rules</span></button>
  </nav>
  <main>
    <div id="tab-names" class="tab-panel active"></div>
    <div id="tab-npcs" class="tab-panel hidden"></div>
    <div id="tab-pc" class="tab-panel hidden"></div>
    <div id="tab-encounter" class="tab-panel hidden"></div>
    <div id="tab-dice" class="tab-panel hidden"></div>
    <div id="tab-initiative" class="tab-panel hidden"></div>
    <div id="tab-rules" class="tab-panel hidden"></div>
  </main>
  <script type="module" src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
